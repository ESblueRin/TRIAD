<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="432" viewBox="0 0 1200 432" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">One frozen base. Three independent user adapters.</title>
  <desc id="desc">Good, noisy and hostile interactions are routed into separate LoRA adapters for users A, B and C. All share a frozen base; none updates another user's adapter. This is a conceptual map, not a plot of measured accuracy or degradation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#72879D" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x=".5" y=".5" width="1199" height="431" rx="16" fill="#0E1722" stroke="#29384A"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="43" fill="#E3EDF7" font-size="16" font-weight="650" letter-spacing="1.3">ONE BASE. MANY PERSONAL MODELS.</text>
    <text x="1158" y="43" fill="#8097AD" font-size="11" letter-spacing="1" text-anchor="end">CONCEPTUAL · NOT MEASURED DATA</text>

    <rect x="40" y="131" width="240" height="164" rx="12" fill="#162330" stroke="#3B5168"/>
    <rect x="107" y="151" width="106" height="25" rx="12.5" fill="#233548"/>
    <text x="160" y="168" fill="#B8CEDF" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="2">FROZEN</text>
    <text x="160" y="226" fill="#E7EFF8" text-anchor="middle" font-size="35" font-weight="600">θ_base</text>
    <text x="160" y="262" fill="#A0B4C7" text-anchor="middle" font-size="14">Shared Transformer</text>

    <path d="M280 213H328M328 108V318M328 108H371M328 213H371M328 318H371" stroke="#566C82" stroke-width="1.5"/>
    <circle cx="328" cy="213" r="4" fill="#9BB0C4"/>

    <rect x="384" y="72" width="334" height="74" rx="9" fill="#132B2A" stroke="#294B43"/>
    <rect x="384" y="72" width="4" height="74" rx="2" fill="#78E0C1"/>
    <text x="408" y="103" fill="#78E0C1" font-size="14" font-weight="650" letter-spacing="1">GOOD INTERACTIONS</text>
    <text x="408" y="128" fill="#A8C1BD" font-size="13">Consistent personal corrections</text>

    <rect x="384" y="177" width="334" height="74" rx="9" fill="#2A251C" stroke="#514431"/>
    <rect x="384" y="177" width="4" height="74" rx="2" fill="#E7B96D"/>
    <text x="408" y="208" fill="#E7B96D" font-size="14" font-weight="650" letter-spacing="1">NOISY INTERACTIONS</text>
    <text x="408" y="233" fill="#C5B9A5" font-size="13">False corrections and ambiguity</text>

    <rect x="384" y="282" width="334" height="74" rx="9" fill="#2B1F2A" stroke="#523346"/>
    <rect x="384" y="282" width="4" height="74" rx="2" fill="#EB8EA5"/>
    <text x="408" y="313" fill="#EB8EA5" font-size="14" font-weight="650" letter-spacing="1">HOSTILE INTERACTIONS</text>
    <text x="408" y="338" fill="#C6AEBB" font-size="13">Aggressive, uninformative feedback</text>

    <g stroke="#72879D" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M730 109H796"/>
      <path d="M730 214H796"/>
      <path d="M730 319H796"/>
    </g>
    <g fill="#101E2B" stroke="#304458">
      <rect x="811" y="72" width="347" height="74" rx="9"/>
      <rect x="811" y="177" width="347" height="74" rx="9"/>
      <rect x="811" y="282" width="347" height="74" rx="9"/>
    </g>
    <text x="834" y="103" fill="#D8E5F0" font-size="15" font-weight="600">User A · φ_A</text>
    <text x="834" y="128" fill="#92A9BC" font-size="13">Persistent LoRA adapter</text>
    <text x="834" y="208" fill="#D8E5F0" font-size="15" font-weight="600">User B · φ_B</text>
    <text x="834" y="233" fill="#92A9BC" font-size="13">Persistent LoRA adapter</text>
    <text x="834" y="313" fill="#D8E5F0" font-size="15" font-weight="600">User C · φ_C</text>
    <text x="834" y="338" fill="#92A9BC" font-size="13">Persistent LoRA adapter</text>
    <g stroke-width="2.5" stroke-linecap="round">
      <path d="M1072 123L1087 115L1102 118L1117 101L1132 94" stroke="#78E0C1"/>
      <path d="M1072 224L1087 202L1102 226L1117 208L1132 217" stroke="#E7B96D"/>
      <path d="M1072 300L1087 315L1102 307L1117 328L1132 332" stroke="#EB8EA5"/>
    </g>

    <path d="M40 378H1158" stroke="#29384A"/>
    <text x="40" y="410" fill="#A5BACB" font-size="13">Shared base preserved. Each user's changes stay in their own adapter.</text>
    <text x="1158" y="410" fill="#78E0C1" text-anchor="end" font-size="13">φ_A ≠ φ_B ≠ φ_C is an experimental outcome to measure.</text>
  </g>
</svg>
