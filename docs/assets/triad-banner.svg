<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">TRIAD — Every interaction leaves a trace in the weights.</title>
  <desc id="desc">Teacher-Routed Interaction-Adaptive Distillation. Three colored parameter trajectories branch from the same initial adapter. Decorative conceptual illustration, not experimental measurements.</desc>
