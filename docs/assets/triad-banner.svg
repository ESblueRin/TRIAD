    </linearGradient>
    <radialGradient id="wash" cx="0" cy="0" r="1" gradientTransform="translate(910 230) rotate(90) scale(290 440)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B4252" stop-opacity=".32"/>
      <stop offset="1" stop-color="#1B4252" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ADC5DC" stroke-opacity=".06"/>
    </pattern>
  </defs>
