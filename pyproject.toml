[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "triad-learning"
version = "0.1.0"
description = "Teacher-routed online learning in persistent user-specific LoRA adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6,<3",
  "transformers>=4.51,<5",
  "peft>=0.17,<0.19",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "safetensors>=0.5,<1",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
triad = "triad.cli:main"

[tool.setuptools.packages.find]
include = ["triad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not integration"'
markers = ["integration: opt-in model downloads or live Ollama calls"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
